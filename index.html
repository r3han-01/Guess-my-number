<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css" />
    <title>Guess My Number! | Cyber Arcade</title>
  </head>
  <body>
    <!-- Background Ambient Lights & Grid -->
    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>
    <div class="grid-overlay"></div>

    <!-- Celebration Confetti Canvas -->
    <canvas id="confetti-canvas"></canvas>

    <div class="game-container">
      <header>
        <div class="header-top">
          <button class="btn btn-secondary again" title="Restart Game (R)">
            <span class="btn-icon">🔄</span> Again!
          </button>
          
          <div class="header-controls">
            <button class="icon-btn sound-toggle" id="sound-btn" title="Toggle Sound (M)" aria-label="Toggle sound">
              <span class="sound-icon">🔊</span>
            </button>
          </div>
        </div>

        <h1 class="game-title">Guess My Number!</h1>
        <p class="between">
          <span class="badge">Target</span>
          <span class="range-display">Between <strong id="range-min">1</strong> and <strong id="range-max">20</strong></span>
        </p>

        <!-- Dynamic Range Visual Tracker -->
        <div class="range-tracker-container" title="Current possibilities">
          <div class="range-tracker-bar">
            <div class="range-tracker-active" id="range-tracker-fill"></div>
          </div>
          <div class="range-tracker-labels">
            <span>1</span>
            <span id="range-tracker-hint">20 possibilities</span>
            <span>20</span>
          </div>
        </div>

        <div class="number-box-wrapper">
          <div class="number">?</div>
        </div>
      </header>

      <main>
        <section class="left">
          <div class="input-card">
            <label for="guess-input" class="input-label">Enter your guess</label>
            <div class="input-group">
              <button class="stepper-btn" id="btn-decrement" type="button" aria-label="Decrease guess">-</button>
              <input type="number" id="guess-input" class="guess" min="1" max="20" placeholder="?" autocomplete="off" />
              <button class="stepper-btn" id="btn-increment" type="button" aria-label="Increase guess">+</button>
            </div>
            <button class="btn btn-primary check">
              <span>Check!</span>
              <span class="btn-arrow">⚡</span>
            </button>
          </div>

          <!-- Guess History Section -->
          <div class="history-container" id="history-container">
            <span class="history-label">Guess Trail:</span>
            <div class="history-chips" id="history-chips">
              <span class="chip chip-empty">No guesses yet</span>
            </div>
          </div>
        </section>

        <section class="right">
          <div class="status-card">
            <div class="message-box" id="message-box">
              <p class="message">Start guessing...</p>
            </div>
            
            <div class="stats-panel">
              <div class="stat-item score-item">
                <span class="stat-icon">💯</span>
                <div class="stat-info">
                  <span class="stat-label">Score</span>
                  <span class="stat-value score">10</span>
                </div>
              </div>

              <div class="stat-item highscore-item">
                <span class="stat-icon">🥇</span>
                <div class="stat-info">
                  <span class="stat-label">Highscore</span>
                  <span class="stat-value highscore">0</span>
                </div>
              </div>
            </div>

            <div class="keyboard-hints">
              <span><kbd>Enter</kbd> Guess</span>
              <span><kbd>R</kbd> Restart</span>
              <span><kbd>M</kbd> Mute</span>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
